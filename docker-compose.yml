# Local development dependencies. The app itself runs with `npm run dev`.
# Production images are built from the Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatsflow
      POSTGRES_PASSWORD: whatsflow
      POSTGRES_DB: whatsflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for media files (set STORAGE_DRIVER=s3 to use it).
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: whatsflow
      MINIO_ROOT_PASSWORD: whatsflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Creates the media bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 whatsflow whatsflow-secret; do sleep 1; done;
      mc mb --ignore-existing local/whatsflow"

  # Catches all outgoing email in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
