name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsflow
          POSTGRES_PASSWORD: whatsflow
          POSTGRES_DB: whatsflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whatsflow:whatsflow@localhost:5432/whatsflow
      TEST_DATABASE_URL: postgresql://whatsflow:whatsflow@localhost:5432/whatsflow_test
      E2E_DATABASE_URL: postgresql://whatsflow:whatsflow@localhost:5432/whatsflow_e2e
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      EMAIL_FROM: CI <no-reply@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=whatsflow psql -h localhost -U whatsflow -d whatsflow -c "CREATE DATABASE whatsflow_test"
          PGPASSWORD=whatsflow psql -h localhost -U whatsflow -d whatsflow -c "CREATE DATABASE whatsflow_e2e"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations apply cleanly and schema has no drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
