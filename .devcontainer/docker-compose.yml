# GitHub Codespaces / Dev Containers: the app container plus its services.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on: [postgres, redis, mailpit]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsflow
      POSTGRES_PASSWORD: whatsflow
      POSTGRES_DB: whatsflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Catches every email the app sends. Open the "Emails" port to read them.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
